<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設定新密碼 · FitTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="auth">
  <div class="brand"><span class="dot"></span>FitTracker</div>
  <div class="sub">科學化訓練，從記錄開始</div>
  <div class="card">
    <div class="banner err" th:if="${error}" th:text="${error}"></div>
    <h1>設定新密碼</h1>
    <p class="desc">輸入你的新密碼</p>
    <form th:action="@{/reset}" method="post" onsubmit="return chk()">
      <input type="hidden" name="token" th:value="${token}">
      <div class="fld">
        <label>新密碼</label>
        <div class="inwrap">
          <input type="password" name="password" id="pw" placeholder="至少 8 碼" autocomplete="new-password" required>
          <button type="button" class="eye" onclick="tp('pw',this)">顯示</button>
        </div>
      </div>
      <div class="fld">
        <label>確認新密碼</label>
        <input type="password" id="pw2" placeholder="再次輸入" autocomplete="new-password" required>
        <div class="msg" id="m"></div>
      </div>
      <button class="btn" type="submit">更新密碼</button>
    </form>
    <div class="foot"><a class="link" th:href="@{/login}">← 返回登入</a></div>
  </div>
</div>
<script>
function tp(id,b){var e=document.getElementById(id);var s=e.type==='password';e.type=s?'text':'password';b.textContent=s?'隱藏':'顯示';}
function chk(){var p=document.getElementById('pw').value,p2=document.getElementById('pw2').value,m=document.getElementById('m');
 if(p.length<8){m.textContent='密碼至少 8 碼';return false;}
 if(p!==p2){m.textContent='兩次密碼不一致';return false;} return true;}
</script>
</body></html>
