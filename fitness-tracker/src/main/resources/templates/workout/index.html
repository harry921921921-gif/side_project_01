<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FitTracker - 訓練紀錄</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
        .cal-header    { text-align:center; font-weight:600; font-size:.75rem; padding:3px; color:#6c757d; }
        .cal-day       { min-height:50px; border-radius:5px; padding:3px 4px; background:#fff;
                         border:1px solid #e9ecef; cursor:pointer; transition:.15s; }
        .cal-day:hover { background:#f0f4ff; border-color:#adb5bd; }
        .cal-day.today { border-color:#0d6efd; background:#f0f4ff; }
        .cal-day.selected { border-color:#0d6efd; background:#dde8ff; box-shadow:0 0 0 2px #0d6efd44; }
        .cal-day.empty { background:transparent; border-color:transparent; cursor:default; }
        .cal-day .day-num { font-size:.75rem; font-weight:600; color:#343a40; line-height:1.2; }
        .cal-day.today .day-num { color:#0d6efd; }
        .bp-dot { display:inline-block; font-size:.78rem; font-weight:600; padding:2px 6px; border-radius:4px;
                  margin:1px 1px 0 0; white-space:nowrap; line-height:1.4; }
        .detail-panel { background:#fff; border:1px solid #dee2e6; border-radius:8px; padding:14px; min-height:60px; }

        /* 動作明細表格窄螢幕（手機）改成一動作一張卡，取代 7 欄表格避免橫向撐開版面；
           桌面版（>=768px）維持原本的表格不受影響，兩者用同一份資料，只是切換顯示哪一種 */
        .set-card { border:1px solid #dee2e6; border-radius:10px; padding:10px 12px; margin-bottom:8px; }
        .set-card:last-child { margin-bottom:0; }
        .set-card .head-line { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; gap:8px; }
        .set-card .ex-name { font-weight:700; font-size:.92rem; }
        .set-card .ex-weight { font-weight:800; font-size:.95rem; white-space:nowrap; }
        .set-card .chips { display:flex; flex-wrap:wrap; gap:6px; }
        .set-card .chip-mini { font-size:.74rem; font-weight:600; color:#495057; background:#f1f3f5; padding:3px 9px; border-radius:8px; }

        /* 新增訓練表單：每個動作一張淺色卡片，取代原本擠成一排的欄位，
           每個數字欄位上方加小標籤，手機/桌面都看得出來是在填什麼，不用再對照最上面那排標題 */
        .wo-add-card .card-header { border-bottom:1px solid #eef1f5; padding:14px 20px; }
        .wo-add-card .card-body { padding:20px; }
        .wo-add-card .form-label { font-size:.82rem; color:#495057; }
        .ex-row-card { background:#f8fafc; border:1px solid #e7ebf1; border-left:3px solid #0d6efd55;
                        border-radius:10px; padding:14px 16px; margin-bottom:12px; transition:border-color .15s,box-shadow .15s; }
        .ex-row-card:hover { border-color:#d7dee8; border-left-color:#0d6efd; box-shadow:0 2px 10px rgba(15,23,42,.05); }
        .ex-row-head { display:flex; align-items:center; gap:10px; }
        .ex-row-head .ex-row-main { flex:1 1 auto; }
        .ex-remove-btn { flex:0 0 auto; border:none; background:transparent; color:#c53030; font-size:1.05rem;
                          line-height:1; width:30px; height:30px; border-radius:7px; transition:background .15s; }
        .ex-remove-btn:hover:not(:disabled) { background:#fee2e2; }
        .ex-remove-btn:disabled { color:#cbd5e0; cursor:not-allowed; }
        .ex-field-group { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
        .ex-field { flex:1 1 100px; min-width:84px; }
        .ex-field label { display:block; font-size:.72rem; color:#8a94a6; font-weight:600; margin-bottom:3px; }
        .ex-sub-row { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center;
                       margin-top:12px; padding-top:12px; border-top:1px dashed #e2e8f0; }
        .ex-sub-row .rpe-field { width:92px; }
        .ex-sub-row .status-field { flex:1 1 170px; }
        .ex-sub-row details { flex:1 1 220px; }
        .ex-sub-row summary { cursor:pointer; font-size:.8rem; color:#6b7688; user-select:none; }
        .ex-sub-row summary:hover { color:#0d6efd; }
        .wo-add-actions { border-top:1px solid #eef1f5; padding-top:16px; margin-top:6px; }
        .wo-add-actions .btn { border-radius:8px; font-weight:600; padding:8px 18px; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <h2 class="mb-4">🏋️ 訓練紀錄</h2>

    <div class="alert alert-danger" th:if="${formError}" th:text="${formError}"></div>

    <!-- ── 新增訓練 ── -->
    <div class="card mb-4 shadow-sm wo-add-card">
        <div class="card-header bg-white"><h5 class="mb-0">➕ 新增訓練</h5></div>
        <div class="card-body">
            <form th:action="@{/workout}" method="post">
                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <label class="form-label fw-semibold" for="workoutDate">日期</label>
                        <input type="date" name="workoutDate" id="workoutDate" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold" for="bodyPartSelect">訓練部位</label>
                        <select name="bodyPart" id="bodyPartSelect" class="form-select" required>
                            <option value="">請選擇</option>
                            <option th:each="bp : ${bodyParts}" th:value="${bp.name}" th:text="${bp.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="workoutNote">備註（選填）</label>
                        <input type="text" name="note" id="workoutNote" class="form-control" placeholder="今天狀態如何？">
                    </div>
                </div>

                <div id="exerciseContainer">
                    <div class="exercise-row-wrapper ex-row-card">
                        <div class="ex-row-head">
                            <div class="ex-row-main">
                                <input type="text" name="exerciseNames" class="form-control exercise-name-input" aria-label="動作名稱"
                                       placeholder="輸入或選擇動作..." required>
                            </div>
                            <button type="button" class="ex-remove-btn" aria-label="移除這個動作" onclick="removeRow(this)" disabled>✕</button>
                        </div>
                        <div class="ex-field-group">
                            <div class="ex-field">
                                <label for="wField-w-0">重量(kg)</label>
                                <input type="number" id="wField-w-0" name="weightKgs" class="form-control" aria-label="重量(kg)" placeholder="80" step="0.5" min="0">
                            </div>
                            <div class="ex-field">
                                <label for="wField-s-0">組數</label>
                                <input type="number" id="wField-s-0" name="sets" class="form-control" aria-label="組數" placeholder="4" min="1">
                            </div>
                            <div class="ex-field">
                                <label for="wField-r-0">次數</label>
                                <input type="number" id="wField-r-0" name="reps" class="form-control" aria-label="次數" placeholder="8" min="1">
                            </div>
                            <div class="ex-field">
                                <label for="wField-rt-0">休息(秒)</label>
                                <input type="number" id="wField-rt-0" name="restSeconds" class="form-control" aria-label="休息(秒)" placeholder="90" min="0" step="10">
                            </div>
                        </div>
                        <div class="ex-sub-row">
                            <div class="rpe-field">
                                <input type="number" name="rpes" class="form-control form-control-sm" aria-label="RPE 疲勞度" placeholder="RPE" step="0.5" min="1" max="10">
                            </div>
                            <div class="status-field">
                                <select name="completionStatuses" class="form-select form-select-sm" aria-label="完成狀態">
                                    <option value="">完成狀態（選填）</option>
                                    <option th:each="status : ${completionStatuses}" th:value="${status.name()}" th:text="${status.name()}"></option>
                                </select>
                            </div>
                            <!-- 實際次數/重量預設收合：跟計畫不同才需要填，平常不用一開始就佔兩個欄位 -->
                            <details>
                                <summary>▸ 跟計畫不同？填實際數值</summary>
                                <div class="row g-2 mt-2">
                                    <div class="col-6">
                                        <input type="number" name="actualReps" class="form-control form-control-sm" aria-label="實際次數" placeholder="實際次數" min="0">
                                    </div>
                                    <div class="col-6">
                                        <input type="number" name="actualWeights" class="form-control form-control-sm" aria-label="實際重量" placeholder="實際重量" step="0.5" min="0">
                                    </div>
                                </div>
                            </details>
                        </div>
                    </div>
                </div>
                <div class="d-flex gap-2 wo-add-actions">
                    <button type="button" class="btn btn-outline-secondary" onclick="addExerciseRow()">＋ 新增動作</button>
                    <button type="submit" class="btn btn-primary">💾 儲存訓練</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ── 本週訓練 ── -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white"><h5 class="mb-0">📆 本週訓練</h5></div>
        <div class="card-body">
            <div th:if="${recentWeekSessions.empty}" class="text-muted text-center py-3">近 7 天尚無訓練紀錄，快去流汗！</div>
            <div th:unless="${recentWeekSessions.empty}">
                <div th:each="ws : ${recentWeekSessions}" class="card mb-2 border">
                    <!-- 摘要列：只顯示日期與部位，點擊或鍵盤 Enter/Space 展開詳情 -->
                    <div class="d-flex justify-content-between align-items-center p-2" style="cursor:pointer"
                         role="button" tabindex="0"
                         th:attr="aria-label='展開 ' + ${ws.workoutDate} + ' ' + ${ws.bodyPart} + ' 的訓練詳情'"
                         th:onclick="'toggleDetail(' + ${ws.id} + ')'"
                         th:onkeydown="'if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleDetail(' + ${ws.id} + ');}'">
                        <div>
                            <strong th:text="${ws.workoutDate}"></strong>
                            <span class="badge bg-primary ms-2" th:text="${ws.bodyPart}"></span>
                        </div>
                        <span class="text-muted small">詳情 ▾</span>
                    </div>
                    <div th:id="'detail-' + ${ws.id}" class="border-top" style="display:none">
                    <!-- 顯示模式 -->
                    <div th:id="'view-' + ${ws.id}">
                        <div class="card-header bg-white d-flex justify-content-end align-items-center">
                            <div class="d-flex gap-2">
                                <button type="button" class="btn btn-sm btn-outline-secondary"
                                        th:onclick="'toggleEdit(' + ${ws.id} + ')'">✏️ 編輯</button>
                                <form th:action="@{/workout/delete/{id}(id=${ws.id})}" method="post"
                                      onsubmit="return confirm('確定刪除這筆訓練紀錄？')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">🗑 刪除</button>
                                </form>
                            </div>
                        </div>
                        <div class="card-body p-0">
                            <!-- 桌面版（>=768px）：原本的表格，動作多欄位一次看完 -->
                            <table class="table table-sm mb-0 d-none d-md-table" th:unless="${ws.sets.empty}">
                                <thead class="table-light">
                                    <tr><th>動作</th><th>重量</th><th>組數</th><th>次數</th><th>休息</th><th>RPE</th><th>狀態</th></tr>
                                </thead>
                                <tbody>
                                    <tr th:each="set : ${ws.sets}">
                                        <td th:text="${set.exerciseName}"></td>
                                        <td th:text="${set.weightKg != null ? set.weightKg + ' kg' : '體重'}"></td>
                                        <td th:text="${set.sets}"></td>
                                        <td th:text="${set.reps}"></td>
                                        <td th:text="${set.restSeconds != null ? set.restSeconds + '秒' : '-'}"></td>
                                        <td th:text="${set.rpe != null ? set.rpe : '-'}"></td>
                                        <td>
                                            <span th:if="${set.completionStatus != null}"
                                                  class="badge"
                                                  th:classappend="${set.completionStatus.name() == 'COMPLETE'} ? 'bg-success' : (${set.completionStatus.name() == 'FAILED'} ? 'bg-danger' : (${set.completionStatus.name() == 'PAIN'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                                  th:text="${set.completionStatus.name()}"></span>
                                            <span th:unless="${set.completionStatus != null}">-</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <!-- 手機版（<768px）：改成一動作一張卡，避免 7 欄表格橫向撐開版面 -->
                            <div class="d-md-none p-2" th:unless="${ws.sets.empty}">
                                <div class="set-card" th:each="set : ${ws.sets}">
                                    <div class="head-line">
                                        <span class="ex-name" th:text="${set.exerciseName}"></span>
                                        <span class="ex-weight" th:text="${set.weightKg != null ? set.weightKg + ' kg' : '體重'}"></span>
                                    </div>
                                    <div class="chips">
                                        <span class="chip-mini" th:text="${set.sets} + ' 組'"></span>
                                        <span class="chip-mini" th:text="${set.reps} + ' 下'"></span>
                                        <span class="chip-mini" th:if="${set.restSeconds != null}" th:text="'休息 ' + ${set.restSeconds} + ' 秒'"></span>
                                        <span class="chip-mini" th:if="${set.rpe != null}" th:text="'RPE ' + ${set.rpe}"></span>
                                        <span th:if="${set.completionStatus != null}"
                                              class="badge"
                                              th:classappend="${set.completionStatus.name() == 'COMPLETE'} ? 'bg-success' : (${set.completionStatus.name() == 'FAILED'} ? 'bg-danger' : (${set.completionStatus.name() == 'PAIN'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                              th:text="${set.completionStatus.name()}"></span>
                                    </div>
                                </div>
                            </div>
                            <p class="text-muted p-2 mb-0 small"
                               th:if="${ws.note != null and !ws.note.isEmpty()}"
                               th:text="'📝 ' + ${ws.note}"></p>
                        </div>
                        <!-- 上一次同部位訓練內容（供比較） -->
                        <div class="card-footer bg-light" th:if="${lastSameBodyPartSession[ws.id] != null}">
                            <div class="small text-muted mb-1">
                                🔁 上次「<span th:text="${ws.bodyPart}"></span>」訓練
                                (<span th:text="${lastSameBodyPartSession[ws.id].workoutDate}"></span>)
                            </div>
                            <!-- 只有 5 欄且欄寬較窄，用橫向捲動當安全網就夠，不用另外做卡片版 -->
                            <div class="table-responsive" th:unless="${lastSameBodyPartSession[ws.id].sets.empty}">
                            <table class="table table-sm mb-0">
                                <thead class="table-light">
                                    <tr><th>動作</th><th>重量</th><th>組數</th><th>次數</th><th>RPE</th></tr>
                                </thead>
                                <tbody>
                                    <tr th:each="set : ${lastSameBodyPartSession[ws.id].sets}">
                                        <td th:text="${set.exerciseName}"></td>
                                        <td th:text="${set.weightKg != null ? set.weightKg + ' kg' : '體重'}"></td>
                                        <td th:text="${set.sets}"></td>
                                        <td th:text="${set.reps}"></td>
                                        <td th:text="${set.rpe != null ? set.rpe : '-'}"></td>
                                    </tr>
                                </tbody>
                            </table>
                            </div>
                        </div>
                    </div>
                    <!-- 編輯模式 -->
                    <div th:id="'edit-' + ${ws.id}" style="display:none">
                        <div class="card-header bg-warning bg-opacity-10"><strong>✏️ 編輯訓練</strong></div>
                        <div class="card-body">
                            <form th:action="@{/workout/update/{id}(id=${ws.id})}" method="post">
                                <div class="row g-2 mb-3">
                                    <div class="col-md-3">
                                        <label class="form-label small">日期</label>
                                        <input type="date" name="workoutDate" class="form-control form-control-sm"
                                               th:value="${ws.workoutDate}" required>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label small">訓練部位</label>
                                        <select name="bodyPart" class="form-select form-select-sm" required>
                                            <option th:each="bp : ${bodyParts}"
                                                    th:value="${bp.name}" th:text="${bp.name}"
                                                    th:selected="${bp.name == ws.bodyPart}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small">備註</label>
                                        <input type="text" name="note" class="form-control form-control-sm"
                                               th:value="${ws.note}">
                                    </div>
                                </div>
                                <div class="row g-1 mb-1 text-muted" style="font-size:.75rem">
                                    <div class="col-4">動作</div><div class="col-2">重量</div>
                                    <div class="col-1">組</div><div class="col-1">次</div><div class="col-2">休息(秒)</div>
                                </div>
                                <div th:each="set : ${ws.sets}" class="border rounded p-2 mb-2">
                                    <div class="row g-2 align-items-center mb-1">
                                        <div class="col-4">
                                            <input type="text" name="exerciseNames" class="form-control form-control-sm"
                                                   th:value="${set.exerciseName}" required>
                                        </div>
                                        <div class="col-2">
                                            <input type="number" name="weightKgs" class="form-control form-control-sm"
                                                   th:value="${set.weightKg}" step="0.5" min="0">
                                        </div>
                                        <div class="col-1">
                                            <input type="number" name="sets" class="form-control form-control-sm"
                                                   th:value="${set.sets}" min="1">
                                        </div>
                                        <div class="col-1">
                                            <input type="number" name="reps" class="form-control form-control-sm"
                                                   th:value="${set.reps}" min="1">
                                        </div>
                                        <div class="col-2">
                                            <input type="number" name="restSeconds" class="form-control form-control-sm"
                                                   th:value="${set.restSeconds}" min="0" step="10">
                                        </div>
                                    </div>
                                    <div class="row g-2 align-items-center">
                                        <div class="col-md-3">
                                            <input type="number" name="rpes" class="form-control form-control-sm"
                                                   th:value="${set.rpe}" placeholder="RPE" step="0.5" min="1" max="10">
                                        </div>
                                        <div class="col-md-4">
                                            <select name="completionStatuses" class="form-select form-select-sm">
                                                <option value="" th:selected="${set.completionStatus == null}">完成狀態（選填）</option>
                                                <option th:each="status : ${completionStatuses}" th:value="${status.name()}" th:text="${status.name()}" th:selected="${set.completionStatus != null and set.completionStatus.name() == status.name()}"></option>
                                            </select>
                                        </div>
                                        <div class="col-md-5">
                                            <!-- 已經有實際數值的話預設展開，不要把既有資料藏起來 -->
                                            <details th:attr="open=${set.actualReps != null or set.actualWeight != null} ? 'open' : null">
                                                <summary class="small text-muted" style="cursor:pointer">跟計畫不同？填實際數值</summary>
                                                <div class="row g-2 mt-1">
                                                    <div class="col-6">
                                                        <input type="number" name="actualReps" class="form-control form-control-sm" aria-label="實際次數"
                                                               th:value="${set.actualReps}" placeholder="實際次數" min="0">
                                                    </div>
                                                    <div class="col-6">
                                                        <input type="number" name="actualWeights" class="form-control form-control-sm" aria-label="實際重量"
                                                               th:value="${set.actualWeight}" placeholder="實際重量" step="0.5" min="0">
                                                    </div>
                                                </div>
                                            </details>
                                        </div>
                                    </div>
                                </div>
                                <div class="d-flex gap-2 mt-2">
                                    <button type="submit" class="btn btn-success btn-sm">💾 儲存修改</button>
                                    <button type="button" class="btn btn-secondary btn-sm"
                                            th:onclick="'toggleEdit(' + ${ws.id} + ')'">取消</button>
                                </div>
                            </form>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ── 月曆 ── -->
    <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center py-2">
            <button class="btn btn-sm btn-outline-secondary" onclick="prevMonth()">&#8249;</button>
            <h6 class="mb-0" id="calTitle"></h6>
            <button class="btn btn-sm btn-outline-secondary" onclick="nextMonth()">&#8250;</button>
        </div>
        <div class="card-body pb-2 pt-3">
            <div class="calendar-grid mb-1">
                <div class="cal-header">日</div><div class="cal-header">一</div>
                <div class="cal-header">二</div><div class="cal-header">三</div>
                <div class="cal-header">四</div><div class="cal-header">五</div>
                <div class="cal-header">六</div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
        <div class="card-body border-top pt-3 pb-2" id="dayDetail" style="display:none">
            <h6 id="dayDetailTitle" class="mb-2 text-muted"></h6>
            <div id="dayDetailContent" class="detail-panel"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/exercise-combobox.js}"></script>
<script th:inline="javascript">
    document.getElementById('workoutDate').valueAsDate = new Date();

    // Thymeleaf 直接轉 JS 物件（不是字串）
    const calendarData  = /*[[${calendarData}]]*/ {};
    const sessionsData  = /*[[${sessionsData}]]*/ [];
    const allExercises  = /*[[${exercisesData}]]*/ [];

    const bpColors = {
        '胸':'#cfe2ff','背':'#d1e7dd','腿':'#fff3cd','肩':'#f8d7da',
        '手臂':'#e2d9f3','核心':'#fde8d8','全身':'#dee2e6'
    };
    function bpColor(bp) { return bpColors[bp] || '#e9ecef'; }

    // ── 月曆 ──────────────────────────────────────────────
    let curYear = new Date().getFullYear();
    let curMonth = new Date().getMonth();
    let selectedDate = null;

    function renderCalendar() {
        document.getElementById('calTitle').textContent =
            curYear + ' 年 ' + (curMonth + 1) + ' 月';
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        const firstDay    = new Date(curYear, curMonth, 1).getDay();
        const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
        const today       = new Date();

        for (let i = 0; i < firstDay; i++) {
            const e = document.createElement('div');
            e.className = 'cal-day empty';
            grid.appendChild(e);
        }
        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = curYear + '-'
                + String(curMonth + 1).padStart(2, '0') + '-'
                + String(d).padStart(2, '0');
            const cell = document.createElement('div');
            cell.className = 'cal-day';
            if (today.getFullYear() === curYear && today.getMonth() === curMonth && today.getDate() === d)
                cell.classList.add('today');
            if (selectedDate === dateStr)
                cell.classList.add('selected');

            const numEl = document.createElement('div');
            numEl.className = 'day-num';
            numEl.textContent = d;
            cell.appendChild(numEl);

            // 顯示當天訓練部位標籤
            const workouts = calendarData[dateStr] || [];
            workouts.forEach(bp => {
                if (!bp) return;
                const dot = document.createElement('span');
                dot.className = 'bp-dot';
                dot.style.background = bpColor(bp);
                dot.textContent = bp;
                cell.appendChild(dot);
            });

            cell.addEventListener('click', () => selectDate(dateStr));
            grid.appendChild(cell);
        }
    }

    function selectDate(dateStr) {
        selectedDate = dateStr;
        renderCalendar();

        const panel   = document.getElementById('dayDetail');
        const title   = document.getElementById('dayDetailTitle');
        const content = document.getElementById('dayDetailContent');
        panel.style.display = 'block';
        title.textContent   = dateStr + ' 的訓練';

        const daySessions = sessionsData.filter(s => s.workoutDate === dateStr);
        if (!daySessions.length) {
            content.innerHTML = '<p class="text-muted mb-0">這天沒有訓練紀錄</p>';
            return;
        }
        let html = '';
        daySessions.forEach(s => {
            html += `<div class="mb-2">
                <span class="badge bg-primary me-2">${s.bodyPart || ''}</span>
                ${s.note ? '<small class="text-muted">📝 ' + s.note + '</small>' : ''}
            </div>`;
            if (s.sets && s.sets.length) {
                // 手機窄螢幕沒地方放 7 欄，外面包 overflow-x 當安全網，不會把整個日曆面板撐開橫向捲動
                html += `<div style="overflow-x:auto"><table class="table table-sm table-bordered mb-2">
                    <thead class="table-light"><tr><th>動作</th><th>重量</th><th>組</th><th>次</th><th>休息</th><th>RPE</th><th>狀態</th></tr></thead><tbody>`;
                s.sets.forEach(set => {
                    html += `<tr>
                        <td>${set.exerciseName}</td>
                        <td>${set.weightKg != null ? set.weightKg + ' kg' : '體重'}</td>
                        <td>${set.sets != null ? set.sets : '-'}</td>
                        <td>${set.reps != null ? set.reps : '-'}</td>
                        <td>${set.restSeconds != null ? set.restSeconds + '秒' : '-'}</td>
                        <td>${set.rpe != null ? set.rpe : '-'}</td>
                        <td>${set.completionStatus ? set.completionStatus : '-'}</td>
                    </tr>`;
                });
                html += '</tbody></table></div>';
            }
        });
        content.innerHTML = html;
    }

    function prevMonth() {
        if (--curMonth < 0) { curMonth = 11; curYear--; }
        renderCalendar();
        document.getElementById('dayDetail').style.display = 'none';
        selectedDate = null;
    }
    function nextMonth() {
        if (++curMonth > 11) { curMonth = 0; curYear++; }
        renderCalendar();
        document.getElementById('dayDetail').style.display = 'none';
        selectedDate = null;
    }

    renderCalendar();

    // ── 動作搜尋 + 新增 ────────────────────────────────────
    // 目前訓練部位選了什麼，建議清單就只列那個部位的動作；沒選就列全部。
    // 是即時讀 DOM 的函式而不是存一份快照，訓練部位換了下次打開下拉就自動反映，不用另外監聽 onchange
    function currentExerciseOptions() {
        const bp = document.getElementById('bodyPartSelect').value;
        const filtered = bp ? allExercises.filter(e => e.bodyPart === bp) : allExercises;
        return filtered.map(e => e.name);
    }
    // 打的動作不存在時「＋新增動作」建的個人自訂動作，預設歸在目前選的訓練部位下面
    // （沒選訓練部位就先歸類到「全身」，之後可以在 /manage 改）
    function attachExerciseNameCombobox(input) {
        attachExerciseCombobox(input, {
            getOptions: currentExerciseOptions,
            onCreate: name => createPersonalExercise(name, document.getElementById('bodyPartSelect').value || '全身', 'ISOLATION')
                .then(createdName => { allExercises.push({ name: createdName, bodyPart: document.getElementById('bodyPartSelect').value || '全身' }); return createdName; })
        });
    }
    document.querySelectorAll('.exercise-name-input').forEach(attachExerciseNameCombobox);

    // ── 新增/移除動作列 ───────────────────────────────────
    function addExerciseRow() {
        const container = document.getElementById('exerciseContainer');
        const div = document.createElement('div');
        div.className = 'exercise-row-wrapper ex-row-card';
        div.innerHTML = `
            <div class="ex-row-head">
                <div class="ex-row-main">
                    <input type="text" name="exerciseNames" class="form-control exercise-name-input" aria-label="動作名稱"
                           placeholder="輸入或選擇動作...">
                </div>
                <button type="button" class="ex-remove-btn" aria-label="移除這個動作" onclick="removeRow(this)">✕</button>
            </div>
            <div class="ex-field-group">
                <div class="ex-field">
                    <label>重量(kg)</label>
                    <input type="number" name="weightKgs" class="form-control" aria-label="重量(kg)" placeholder="80" step="0.5" min="0">
                </div>
                <div class="ex-field">
                    <label>組數</label>
                    <input type="number" name="sets" class="form-control" aria-label="組數" placeholder="4" min="1">
                </div>
                <div class="ex-field">
                    <label>次數</label>
                    <input type="number" name="reps" class="form-control" aria-label="次數" placeholder="8" min="1">
                </div>
                <div class="ex-field">
                    <label>休息(秒)</label>
                    <input type="number" name="restSeconds" class="form-control" aria-label="休息(秒)" placeholder="90" min="0" step="10">
                </div>
            </div>
            <div class="ex-sub-row">
                <div class="rpe-field">
                    <input type="number" name="rpes" class="form-control form-control-sm" aria-label="RPE 疲勞度" placeholder="RPE" step="0.5" min="1" max="10">
                </div>
                <div class="status-field">
                    <select name="completionStatuses" class="form-select form-select-sm" aria-label="完成狀態">
                        <option value="">完成狀態（選填）</option>
                        <option value="COMPLETE">✅ 完成</option>
                        <option value="FAILED">❌ 失敗</option>
                        <option value="DROPPED">⬇️ 降重完成</option>
                        <option value="PAIN">⚠️ 疼痛</option>
                    </select>
                </div>
                <details>
                    <summary>▸ 跟計畫不同？填實際數值</summary>
                    <div class="row g-2 mt-2">
                        <div class="col-6">
                            <input type="number" name="actualReps" class="form-control form-control-sm" aria-label="實際次數" placeholder="實際次數" min="0">
                        </div>
                        <div class="col-6">
                            <input type="number" name="actualWeights" class="form-control form-control-sm" aria-label="實際重量" placeholder="實際重量" step="0.5" min="0">
                        </div>
                    </div>
                </details>
            </div>`;
        container.appendChild(div);
        attachExerciseNameCombobox(div.querySelector('.exercise-name-input'));
    }
    function removeRow(btn) { btn.closest('.exercise-row-wrapper').remove(); }

    // ── 展開/收合詳情 ─────────────────────────────────────
    function toggleDetail(id) {
        const detail = document.getElementById('detail-' + id);
        detail.style.display = (detail.style.display === 'none') ? '' : 'none';
    }

    // ── 編輯切換 ──────────────────────────────────────────
    function toggleEdit(id) {
        const view = document.getElementById('view-' + id);
        const edit = document.getElementById('edit-' + id);
        const editing = edit.style.display !== 'none';
        view.style.display = editing ? '' : 'none';
        edit.style.display = editing ? 'none' : '';
    }
</script>
</body>
</html>
