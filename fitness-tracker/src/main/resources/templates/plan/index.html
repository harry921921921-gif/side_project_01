<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訓練計劃 · FitTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<!-- 只有最上面導覽列跟其他頁一樣用 Bootstrap（共用 fragments/navbar.html），下面內容維持原本這頁自己的設計 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb;--surface:#fff;--ink:#0f172a;--muted:#64748b;--faint:#94a3b8;
  --line:#eaeef5;--accent:#10b981;--accent-ink:#065f46;--accent-soft:#d1fae5;
  --radius:18px;--radius-sm:12px;--shadow:0 6px 24px rgba(15,23,42,.06);--shadow-lg:0 12px 40px rgba(15,23,42,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.hero{padding:34px 0 10px}
.hero h1{font-size:1.9rem;font-weight:800;letter-spacing:-.03em}
.hero p{color:var(--muted);margin-top:6px;font-size:.98rem}
.pl-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
.pad{padding:24px}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px}
.field label{display:block;font-size:.78rem;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px}
.seg{display:inline-flex;background:#eef1f7;border-radius:12px;padding:4px;gap:3px;width:100%}
.seg button{flex:1;border:0;background:transparent;padding:9px 8px;border-radius:9px;font:inherit;font-weight:600;font-size:.86rem;color:var(--muted);cursor:pointer;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.active{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(15,23,42,.1)}
.seg.accent button.active{background:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(16,185,129,.4)}
.lift-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:6px}
.lift-input{border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;background:#fbfcfe;transition:.15s}
.lift-input:focus-within{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.lift-input .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.lift-input .nm{font-weight:700;font-size:.95rem}
.lift-input .orm{font-size:.72rem;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:3px 9px;border-radius:20px}
.lift-input .ins{display:flex;align-items:center;gap:8px}
.lift-input input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:.95rem;font-weight:600;text-align:center;outline:none;transition:.15s}
.lift-input input:focus{border-color:var(--accent)}
.lift-input .x{color:var(--faint);font-weight:700}
.hint{margin-top:16px;font-size:.85rem;color:var(--muted);display:flex;gap:9px;align-items:flex-start;background:#f0fdf9;border:1px solid var(--accent-soft);border-radius:var(--radius-sm);padding:12px 14px}
.hint b{color:var(--accent-ink)}
.sec-title{display:flex;align-items:center;gap:10px;margin:32px 0 16px;font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.sec-title .ln{flex:1;height:1px;background:var(--line)}

/* timeline / progress */
.tl-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tl-head .big{font-size:1.05rem;font-weight:800}
.tl-head .nx{font-size:.86rem;color:var(--muted)}
.tl-head .nx b{color:var(--accent-ink)}
.tl-track{display:flex;gap:6px;height:64px}
.tl-seg{border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;transition:.2s;opacity:.5;position:relative;overflow:hidden;cursor:pointer}
.tl-seg.on{opacity:1;box-shadow:var(--shadow)}
.tl-seg .pn{font-size:.82rem;font-weight:800}
.tl-seg .pw{font-size:.72rem;font-weight:600;opacity:.85}
.tl-fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.35)}
.tl-slider{margin-top:16px}
.tl-slider input{width:100%}
.tl-week{display:flex;justify-content:space-between;font-size:.78rem;color:var(--faint);margin-top:6px}
.dl-check{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:.88rem;font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
.dl-check input{width:18px;height:18px;accent-color:var(--accent)}

.today{position:relative;overflow:hidden}
.today .bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--accent),#059669)}
.today .head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.today .head h3{font-size:1.25rem;font-weight:800;letter-spacing:-.02em}
.chip{font-size:.76rem;font-weight:700;padding:5px 12px;border-radius:20px}
.exlist{margin-top:14px}
.exrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:0}
.exrow .l .nm{font-weight:700;font-size:1rem}
.exrow .l .sub{font-size:.8rem;color:var(--faint);margin-top:2px}
.exrow .r{text-align:right;display:flex;align-items:center;gap:12px}
.exrow .wt{font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}
.exrow .wt small{font-weight:600;color:var(--muted);font-size:.8rem}
.nbadge{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.b-up{background:var(--accent-soft);color:var(--accent-ink)}
.cta{display:flex;gap:10px;margin-top:20px}
.pl-btn{border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;font-size:.92rem;cursor:pointer;transition:.15s}
.pl-btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.35)}
.pl-btn-primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
.pl-btn-ghost{background:#f1f5f9;color:var(--ink)}
.pl-btn-ghost:hover{background:#e5ebf2}
.deload{display:flex;gap:10px;align-items:center;background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:var(--radius-sm);padding:12px 14px;font-size:.88rem;margin:14px 0 4px}
.form-error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:var(--radius-sm);padding:12px 16px;font-size:.88rem;font-weight:600;margin-bottom:16px}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:.18s}
.day:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.day.rest{background:#f8fafc;border-style:dashed}
.day .dh{padding:14px 18px;font-weight:800;font-size:.98rem;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.day.rest .dh{border-bottom:0;color:var(--muted)}
.day .dh .tag{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.day .dsub{padding:9px 18px 0;font-size:.76rem;color:var(--faint);font-weight:600;display:flex;align-items:center;gap:5px}
.day .db{padding:8px 18px 16px}
.card-icon-btn{border:0;background:#f1f5f9;color:var(--muted);width:26px;height:26px;border-radius:8px;font-size:.85rem;cursor:pointer;flex-shrink:0;line-height:1}
.card-icon-btn:hover{background:#e5ebf2;color:var(--ink)}
[data-card-idx]{cursor:grab}
[data-card-idx].dragging{opacity:.35}
.edit-panel{padding:6px 18px 18px}
.today .edit-panel{padding:6px 0 0}
.edit-label{display:block;font-size:.72rem;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 8px}
.edit-list{display:flex;flex-direction:column;gap:6px}
.edit-row{display:flex;gap:8px;align-items:center}
.edit-row select{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:inherit;background:#fbfcfe}
.drow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow .dn{font-size:.9rem;font-weight:600}
.drow .dn.acc{font-weight:500;color:var(--muted)}
.drow .dw{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
footer{text-align:center;color:var(--faint);font-size:.82rem;padding:40px 0 30px}

/* runner overlay */
.runner{position:fixed;top:74px;right:20px;z-index:50;display:none;width:320px;max-width:calc(100vw - 32px)}
.runner.on{display:block}
.rbox{width:100%;background:var(--surface);border-radius:16px;padding:18px 16px;text-align:center;box-shadow:0 16px 44px rgba(15,23,42,.26);border:1px solid var(--line)}
.rbox .step{font-size:.72rem;font-weight:700;color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
.rbox h2{font-size:1.2rem;font-weight:800;margin:6px 0 4px;letter-spacing:-.02em}
.rbox .tgt{font-size:.86rem;color:var(--muted);font-weight:600}
.rbox .big-wt{font-size:1.8rem;font-weight:900;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.rbox .big-wt small{font-size:.85rem;color:var(--muted);font-weight:600}
.timer{font-size:2.3rem;font-weight:900;font-variant-numeric:tabular-nums;margin:10px 0;letter-spacing:-.02em}
.timer.warn{color:var(--accent)}
.rprogress{display:flex;gap:5px;justify-content:center;margin:14px 0}
.rdot{width:26px;height:6px;border-radius:3px;background:#e2e8f0}
.rdot.done{background:var(--accent)}
.rdot.cur{background:var(--ink)}
.rbtns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.pl-btn-xl{border:0;border-radius:13px;padding:13px;font:inherit;font-weight:800;font-size:1rem;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 6px 20px rgba(16,185,129,.4);transition:.15s}
.pl-btn-xl:hover{transform:translateY(-2px);filter:brightness(1.05)}
.pl-btn-xl.dark{background:var(--ink);box-shadow:0 6px 20px rgba(15,23,42,.3)}
.pl-btn-mini{border:0;border-radius:10px;padding:10px;font:inherit;font-weight:600;font-size:.86rem;cursor:pointer;background:#f1f5f9;color:var(--muted)}
.pl-btn-mini:hover{background:#e5ebf2;color:var(--ink)}
.rclose{position:absolute;top:12px;right:14px;background:#f1f5f9;border:0;color:var(--muted);width:30px;height:30px;border-radius:50%;font-size:1rem;cursor:pointer}
.rclose:hover{background:#e5ebf2;color:var(--ink)}
.rprogress{margin:10px 0}
.q-row{display:flex;gap:8px;margin-top:14px}
.q-row button{flex:1}

/* 匯入訓練紀錄 modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.on{display:flex}
.modal-box{width:100%;max-width:480px;max-height:86vh;overflow-y:auto;background:var(--surface);border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(15,23,42,.3)}
.modal-box h2{font-size:1.15rem;font-weight:800;margin-bottom:4px}
.modal-box .sub{font-size:.85rem;color:var(--muted);margin-bottom:16px}
.imp-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.imp-row:last-child{border-bottom:0}
.imp-row .nm{flex:1;font-weight:700;font-size:.92rem}
.imp-row input{width:56px;border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit;text-align:center;font-weight:600}
.imp-row .x{color:var(--faint);font-size:.8rem}
.modal-btns{display:flex;gap:10px;margin-top:18px}
.modal-btns button{flex:1}
@media(max-width:600px){.hero h1{font-size:1.5rem}.pad{padding:18px}.tl-seg .pw{display:none}}
</style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="wrap">
  <div class="form-error" th:if="${formError}" th:text="${formError}"></div>
  <section class="hero">
    <h1>打造你的訓練計劃</h1>
    <p>依程度、目標與週期階段，即時算出每個動作的建議重量</p>
    <button type="button" class="pl-btn pl-btn-primary" style="margin-top:14px" onclick="openImportModal()">✅ 我今天練完了，匯入紀錄</button>
  </section>

  <!-- 設定 -->
  <div class="pl-card pad">
    <div class="setup">
      <div class="field">
        <label>程度</label>
        <div class="seg accent" data-seg="mode"><button data-val="novice" class="active">新手</button><button data-val="veteran">中階／老手</button></div>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>一週訓練天數（第 7 天建議休息）</label>
        <div class="seg" data-seg="days">
          <button data-val="1">1</button><button data-val="2">2</button><button data-val="3" class="active">3</button>
          <button data-val="4">4</button><button data-val="5">5</button><button data-val="6">6</button><button data-val="7">7</button>
        </div>
      </div>
    </div>
    <div id="vetBox" style="display:none;margin-top:22px">
      <label style="display:block;font-size:.78rem;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">你的重量（填一組 6–10 下，自動估 1RM）</label>
      <div class="lift-grid" id="liftGrid"></div>
    </div>
    <div id="noviceHint" class="hint"><span>🌱</span><span>新手模式：主項從空槓／輕重量起（深蹲・臥推・肩推 20kg，硬舉 40kg），系統會依你每次的表現自動幫你調整。</span></div>
    <div th:if="${param.saved}" style="background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:10px 12px;font-size:.85rem;margin-top:16px">✓ 課表已儲存（含你的 PR，下次登入自動帶回）</div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap">
      <button type="button" class="pl-btn pl-btn-primary" onclick="savePlan()">💾 儲存我的課表</button>
      <span style="font-size:.83rem;color:var(--muted)">程度／天數／週次／你的 PR 都會存到帳號</span>
    </div>
    <form id="planForm" th:action="@{/plan/save}" method="post" style="display:none">
      <input type="hidden" name="mode" id="f-mode">
      <input type="hidden" name="days" id="f-days">
      <div id="f-prs"></div>
    </form>
  </div>

  <!-- 週期進度 -->
  <script th:inline="javascript">
  window.planSaved = { mode: /*[[${planMode}]]*/ 'NOVICE', days: /*[[${planDays}]]*/ 3, week: /*[[${planWeek}]]*/ 8, prs: /*[[${planPrs}]]*/ {}, mainProgress: /*[[${mainProgress}]]*/ {}, completed: /*[[${completedDays}]]*/ [], queue: /*[[${planQueue}]]*/ [], accPool: /*[[${accessoryPool}]]*/ [] };
  </script>

  <div class="sec-title">週期進度<span class="ln"></span></div>
  <div class="pl-card pad">
    <div class="tl-head">
      <div><div class="big" id="tlNow">肌肥大期</div></div>
      <div class="nx" id="tlNext"></div>
    </div>
    <div class="tl-track" id="tlTrack"></div>
    <div class="tl-slider">
      <input type="range" id="weekSlider" min="1" max="20" value="8">
      <div class="tl-week"><span>第 1 週</span><span id="wkNow" style="font-weight:700;color:var(--ink)">第 8 週</span><span>第 20 週</span></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:14px">
      <label class="dl-check" style="margin-top:0"><input type="checkbox" id="dlChk"><span>本週改為減量週（Deload）</span></label>
      <button type="button" class="pl-btn pl-btn-ghost" style="padding:8px 14px;font-size:.82rem" onclick="confirmSetWeek()">✓ 目前實際就是這一週（拖曳上面滑桿後點這裡才會存）</button>
    </div>
    <form id="weekForm" th:action="@{/plan/week}" method="post" style="display:none">
      <input type="hidden" name="week" id="f-week-only">
    </form>
  </div>

  <!-- 本次課表：本週還沒完成的第一個分化天，不是死板的「今天固定練第一天」 -->
  <div class="sec-title">本次課表<span class="ln"></span></div>
  <div id="todayWrap"></div>

  <!-- 週課表 -->
  <div class="sec-title">本週完整課表<span class="ln"></span><button type="button" class="pl-btn pl-btn-ghost" style="padding:6px 14px;font-size:.82rem" onclick="addNextCourse()">＋ 新增課表</button></div>
  <div class="week" id="weekGrid"></div>

  <footer>FitTracker · 訓練計劃原型　·　規則引擎即時算重量，之後接 Spring AI 產生白話課表</footer>
</main>

<!-- 訓練執行 runner -->
<div class="runner" id="runner"><div class="rbox" style="position:relative">
  <button class="rclose" onclick="Runner.close()">✕</button>
  <div id="runnerBody"></div>
</div></div>

<!-- 匯入訓練紀錄 modal -->
<div class="modal-overlay" id="importModal">
  <div class="modal-box">
    <h2 id="impTitle">今天練完了嗎？</h2>
    <div class="sub">確認每個動作實際完成的重量／組數／次數，沒問題就直接匯入；有調整就改一下再匯入，會存進「訓練紀錄」。</div>
    <div id="impRows"></div>
    <div class="modal-btns">
      <button type="button" class="pl-btn pl-btn-ghost" onclick="closeImportModal()">取消</button>
      <button type="button" class="pl-btn pl-btn-primary" onclick="confirmImport()">✅ 確認匯入</button>
    </div>
  </div>
</div>
<form id="importForm" th:action="@{/workout}" method="post" style="display:none">
  <input type="hidden" name="workoutDate" id="imp-date">
  <input type="hidden" name="bodyPart" id="imp-bodypart">
  <input type="hidden" name="note" id="imp-note">
  <div id="imp-fields"></div>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ===== ProgressionService（JS 版，之後改寫成 Java）===== */
/* 階段用「%1RM 區間 + 組數 + 目標 RIR」定義；次數由 %+RIR 公式算出，避免強度/次數矛盾 */
const PHASE={
  adapt:   {label:'解剖適應',color:'#059669',bg:'#d1fae5',pctLo:0.62,pctHi:0.68, sets:3,rir:3,rest:60},
  hyper:   {label:'肌肥大',  color:'#1d4ed8',bg:'#dbeafe',pctLo:0.70,pctHi:0.80, sets:4,rir:2,rest:90},
  strength:{label:'最大力量',color:'#b45309',bg:'#fef3c7',pctLo:0.85,pctHi:0.875,sets:4,rir:1,rest:180},
  deload:  {label:'減量週',  color:'#475569',bg:'#e2e8f0',pctLo:0.50,pctHi:0.55, sets:2,rir:4,rest:60,reps:'5–6'},
};
const MACRO=[{key:'adapt',start:1,end:6},{key:'hyper',start:7,end:14},{key:'strength',start:15,end:20}];
const TOTAL=20;
const MAIN={'深蹲':{type:'lower',bar:20},'臥推':{type:'upper',bar:20},'硬舉':{type:'lower',bar:40},'肩推':{type:'upper',bar:20}};
/* 時間預算：一天約 60 分鐘 = 熱身 10 分 + Σ每組(動作約 50 秒 + 組間休息) */
const WARMUP_MIN=10, SET_WORK=50, TIME_CAP=62;
const r25=w=>Math.round(w/2.5)*2.5, fmt=w=>Number.isInteger(w)?w:w.toFixed(1);
const fmtRest=s=>s>=60?(Math.floor(s/60)+'分'+(s%60?s%60+'秒':'')):s+'秒';
/* %1RM ↔ 次數 ↔ RIR：Epley 反推力竭次數，再扣掉保留次數 */
const maxRepsAt=p=>30*(1/p-1);
const repsAtRir=(p,rir)=>Math.max(Math.round(maxRepsAt(p))-rir,1);
const workPct=ph=>(ph.pctLo+ph.pctHi)/2;
const repsRange=ph=>{if(ph.reps)return ph.reps;const lo=repsAtRir(ph.pctHi,ph.rir),hi=repsAtRir(ph.pctLo,ph.rir);return lo===hi?(''+lo):(lo+'–'+hi);};
function estimate1RM(w,r){w=parseFloat(w)||0;r=Math.min(Math.max(parseInt(r)||1,1),12);const rc=Math.min(r,10);return r===1?w:w*(1+rc/30);}
/* 新手模式主項重量：接續「上一次真的完成」的重量往上疊加（上肢+2.5kg／下肢+5kg），
   還沒有任何完成紀錄的動作才從空槓起步；資料來自後端 mainProgress（真實訓練紀錄），不是 LiftPr。
   stalled=連續好幾次都沒真的完成（後端判定，見 WorkoutService.isStalled）——這種情況不能再往上疊加，
   不然線性進步拉長時間會算出不合理的天文數字，改成建議降到約 9 成重新累積 */
function mainWeight(mode,pk,name,orm){
  const ph=PHASE[pk];
  if(mode==='novice'){
    const bar=MAIN[name]?MAIN[name].bar:20;
    const last=((window.planSaved&&window.planSaved.mainProgress)||{})[name];
    if(last&&last.w>0){
      if(last.stalled){
        const deload=r25(last.w*0.9);
        return{w:deload,note:'連續卡關，先降到 '+fmt(deload)+'kg 重新累積信心'};
      }
      const inc=MAIN[name]&&MAIN[name].type==='upper'?2.5:5;
      return{w:r25(last.w+inc),note:'上次完成 '+fmt(last.w)+'kg · +'+inc};
    }
    return{w:bar,note:'空槓起步'};
  }
  const wp=workPct(ph);return{w:r25((orm||0)*wp),note:Math.round(wp*100)+'% 1RM'};
}
function accWeight(mode,pk){if(mode==='novice')return {adapt:10,hyper:12,strength:15,deload:8}[pk];return {adapt:12,hyper:20,strength:25,deload:10}[pk];}
/* 配件動作沒有 1RM 可以算，重量準確度差，改成優先讀「自己存過的重量」（練完/在課表上手動記過一次就會記住），沒存過才用階段預設值 */
function accWeightFor(name,mode,pk){
  const prs=(window.planSaved&&window.planSaved.prs)||{};
  const pr=prs[name];
  return (pr&&pr.w>0)?pr.w:accWeight(mode,pk);
}
function nextWeight(w,type){const inc=type==='upper'?2.5:5;return{w:r25(w+inc),tag:'完成 +'+inc};}
function weekToPhase(wk){for(const m of MACRO)if(wk<=m.end)return m.key;return 'strength';}

/* ===== 課表卡片佇列：本次課表＝queue[0]，本週完整課表＝queue[1...]，可拖曳排序、可編輯動作、可刪除、可新增 =====
   主項只能換另一個主項（重量才算得準，換成別的主項會用該動作自己的 PR 重新算 %1RM），配件可換成任何配件。
   哪些動作排哪一天現在真的查後端 Exercise 表選（/plan/api/queue、/plan/api/next），不再是前端寫死的清單；
   重量/組數/次數還是前端自己算（跟「打 PR 馬上看到建議重量」共用同一套公式），天數以外的切換不用打後端。 */
const MAIN_NAMES=Object.keys(MAIN);
const ACC_POOL=(window.planSaved&&window.planSaved.accPool)||[];
function toQueueDay(dc){return {name:dc.dayName,main:[...dc.mainNames],acc:[...dc.accessoryPool]};}
function applyServerQueue(list){state.queue=(list&&list.length?list:[]).map(toQueueDay);}
function fetchQueue(days,week){
  fetch('/plan/api/queue?days='+days+'&week='+week).then(r=>r.json()).then(list=>{
    applyServerQueue(list);
    state.queueDays=days;
    state.queueWeek=week;
    render();
  });
}
/* 天數/週次改變都要重打後端拿新組成（週次影響配件輪替），但週次滑桿拖曳時 input 事件會連續觸發，
   debounce 一下避免拖曳過程中連續打很多次 API */
let queueFetchTimer=null;
function scheduleQueueFetch(days,week){
  if(queueFetchTimer)clearTimeout(queueFetchTimer);
  queueFetchTimer=setTimeout(()=>fetchQueue(days,week),200);
}
function addNextCourse(){
  const last=state.queue[state.queue.length-1];
  // extra=目前佇列已經有幾張卡：分化天數少時新增課表會在同一週繞回第二圈，同一天名（沒有A/B可分）
  // 光靠 week 轉不出差異，帶這個遞增值讓後端疊加旋轉量，避免繞第二圈時配件跟第一圈一模一樣
  const extra=state.queue.length;
  fetch('/plan/api/next?lastDay='+encodeURIComponent(last.name)+'&days='+state.days+'&week='+state.week+'&extra='+extra)
    .then(r=>r.json())
    .then(dc=>{state.queue.push(toQueueDay(dc));render();});
}
function removeCard(i){
  if(state.queue.length<=1){alert('至少要留一張課表卡喔。');return;}
  state.queue.splice(i,1);
  if(state.editingIdx===i)state.editingIdx=null;
  render();
}
function toggleEditCard(i){state.editingIdx=state.editingIdx===i?null:i;render();}
function removeCardExercise(i,list,idx){
  const d=state.queue[i];
  if(d.main.length+d.acc.length<=1){alert('至少要留一個動作喔。');return;}
  d[list].splice(idx,1);
  render();
}
function addCardExercise(i,list){state.queue[i][list].push(list==='main'?MAIN_NAMES[0]:ACC_POOL[0]);render();}
function changeCardExercise(i,list,idx,name){state.queue[i][list][idx]=name;render();}

/* 拖曳排序：卡片標成 draggable，跨「本次課表」跟「本週完整課表」兩個容器都算同一個 queue，用事件代理不用每次重綁 */
let dragSrcIdx=null;
document.addEventListener('dragstart',e=>{
  const card=e.target.closest('[data-card-idx]');
  if(!card)return;
  dragSrcIdx=+card.dataset.cardIdx;
  e.dataTransfer.effectAllowed='move';
  card.classList.add('dragging');
});
document.addEventListener('dragend',e=>{
  const card=e.target.closest('[data-card-idx]');
  if(card)card.classList.remove('dragging');
});
document.addEventListener('dragover',e=>{if(e.target.closest('[data-card-idx]'))e.preventDefault();});
document.addEventListener('drop',e=>{
  const card=e.target.closest('[data-card-idx]');
  if(!card||dragSrcIdx===null)return;
  e.preventDefault();
  const targetIdx=+card.dataset.cardIdx;
  if(dragSrcIdx!==targetIdx){
    const moved=state.queue.splice(dragSrcIdx,1)[0];
    const insertAt=dragSrcIdx<targetIdx?targetIdx-1:targetIdx;
    state.queue.splice(insertAt,0,moved);
    render();
  }
  dragSrcIdx=null;
});
function cardControlsHtml(i){
  return `<span style="display:inline-flex;gap:4px;margin-left:auto">
    <button type="button" class="card-icon-btn" onclick="event.stopPropagation();toggleEditCard(${i})" title="編輯動作">✎</button>
    <button type="button" class="card-icon-btn" onclick="event.stopPropagation();removeCard(${i})" title="移除這張課表卡">✕</button>
  </span>`;
}
function editPanelHtml(i){
  const d=state.queue[i];
  const row=(list,n,idx)=>`<div class="edit-row"><select onchange="changeCardExercise(${i},'${list}',${idx},this.value)">${(list==='main'?MAIN_NAMES:ACC_POOL).map(m=>`<option value="${m}" ${m===n?'selected':''}>${m}</option>`).join('')}</select><button type="button" class="card-icon-btn" onclick="removeCardExercise(${i},'${list}',${idx})">✕</button></div>`;
  return `<div class="edit-panel">
    <label class="edit-label">主要動作</label>
    <div class="edit-list">${d.main.map((n,idx)=>row('main',n,idx)).join('')}</div>
    <button type="button" class="pl-btn pl-btn-ghost" style="padding:6px 12px;font-size:.8rem;margin:6px 0 12px" onclick="addCardExercise(${i},'main')">＋ 新增主要動作</button>
    <label class="edit-label">配件動作</label>
    <div class="edit-list">${d.acc.map((n,idx)=>row('acc',n,idx)).join('')}</div>
    <button type="button" class="pl-btn pl-btn-ghost" style="padding:6px 12px;font-size:.8rem;margin-top:6px" onclick="addCardExercise(${i},'acc')">＋ 新增配件動作</button>
    <button type="button" class="pl-btn pl-btn-primary" style="width:100%;margin-top:14px" onclick="toggleEditCard(${i})">完成編輯</button>
  </div>`;
}

/* ===== state ===== */

const $=s=>document.querySelector(s);

function buildLiftInputs(){
  var prs=(window.planSaved&&window.planSaved.prs)||{};

      +'<div class="ins"><input type="number" class="vw" data-l="'+n+'" value="'+w+'" min="0" step="2.5">'

function oneRMs(){const m={};document.querySelectorAll('.vw').forEach(el=>{const n=el.dataset.l,r=document.querySelector('.lift-reps[data-l="'+n+'"]').value;m[n]=estimate1RM(el.value,r);const c=document.getElementById('orm-'+n);if(c)c.textContent='1RM '+fmt(r25(m[n]))+'kg';});return m;}
function chip(pk){const p=PHASE[pk];return `<span class="chip" style="background:${p.bg};color:${p.color}">${p.label} · RIR ${p.rir}</span>`;}

/* ===== 匯入訓練紀錄：把今天課表送進 /workout（沿用既有的驗證/CSRF/logging，不重造輪子）===== */
/* 課表的分化名稱（推日/拉日/腿日…）已經在 BodyPartDataInitializer 建成資料庫裡的正式 BodyPart，
   匯入時直接用 today.name 當 bodyPart，不用再轉換成別的分類，跟課表顯示的名稱保持一致 */

function repsToInt(r){
  if(typeof r!=='string')return parseInt(r)||1;
  const parts=r.split(/[–-]/).map(x=>parseInt(x)||0).filter(x=>x>0);
  if(parts.length===2)return Math.round((parts[0]+parts[1])/2);
  return parseInt(r)||1;
}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

          <option value="COMPLETE" selected>✅ 完成</option>

/* 依時間預算產生某天課表：核心動作必排，再依剩餘時間補配件到約 60 分鐘 */
function planDay(day,mode,pk,orm){
  const ph=PHASE[pk], accSets=pk==='deload'?2:3, tps=SET_WORK+ph.rest; // 每組秒數
  const items=[]; let sets=0;
  const mins=()=>WARMUP_MIN+sets*tps/60;
  (day.main||[]).forEach(name=>{
    const mw=mainWeight(mode,pk,name,orm[name]);
    items.push({name,isMain:true,w:mw.w,sets:ph.sets,reps:repsRange(ph),rest:ph.rest,sub:mw.note});
    sets+=ph.sets;
  });
  for(const name of (day.acc||[])){
    if(mins()+accSets*tps/60>TIME_CAP) break;      // 會超過 1 小時就停
    items.push({name,isMain:false,w:accWeightFor(name,mode,pk),sets:accSets,reps:pk==='strength'?'6–8':'10–15',rest:ph.rest,sub:'配件 · 感受控制'});
    sets+=accSets;
  }
  return {items,minutes:Math.round(mins())};
}

function renderTimeline(){
  const wk=state.week, cur=weekToPhase(wk);
  $('#tlTrack').innerHTML=MACRO.map(m=>{
    const p=PHASE[m.key],span=m.end-m.start+1,on=m.key===cur&&!state.deload;
    let fill=0; if(wk>m.end)fill=100; else if(wk>=m.start)fill=((wk-m.start+1)/span)*100;
    return `<div class="tl-seg ${on?'on':''}" style="flex:${span};background:${p.bg};color:${p.color}" data-wk="${m.start}">
      <div class="tl-fill" style="width:${fill}%"></div>
      <div class="pn" style="position:relative">${p.label}</div><div class="pw" style="position:relative">第 ${m.start}–${m.end} 週 · ${span} 週</div></div>`;
  }).join('');
  $('#tlTrack').querySelectorAll('.tl-seg').forEach(s=>s.addEventListener('click',()=>{state.week=+s.dataset.wk;$('#weekSlider').value=state.week;syncWeekUI();render();}));
  const p=PHASE[effPhase()];
  $('#tlNow').textContent=(state.deload?'減量週（本週）':p.label+'期')+' · 第 '+wk+' 週';
  const seg=MACRO.find(m=>m.key===cur), idx=MACRO.indexOf(seg);
  if(idx<MACRO.length-1){const left=seg.end-wk+1;$('#tlNext').innerHTML=`再 <b>${left}</b> 週進入【${PHASE[MACRO[idx+1].key].label}】`;}
  else {const left=Math.max(TOTAL-wk,0);$('#tlNext').innerHTML=left>0?`最後階段，再 <b>${left}</b> 週完成整個週期`:`已完成整個大週期 🎉`;}
}
function syncWeekUI(){$('#wkNow').textContent='第 '+state.week+' 週';}

function render(){
  const {mode}=state, pk=effPhase(), ph=PHASE[pk];
  $('#vetBox').style.display=mode==='veteran'?'block':'none';
  $('#noviceHint').style.display=mode==='veteran'?'none':'flex';
  const orm=mode==='veteran'?oneRMs():{};
  renderTimeline();

  const dn=+state.days;
  if(!state.queue){
    // 第一次渲染：頁面載入時後端已經照目前存的天數＋週次算好課表組成了，直接用，不用多打一次 API
    applyServerQueue(window.planSaved&&window.planSaved.queue);
    state.queueDays=dn;
    state.queueWeek=state.week;
  } else if(state.queueDays!==dn || state.queueWeek!==state.week){
    // 天數或週次被改變：後端還沒算過這個組合的組成（週次會影響配件輪替），打 API 拿新的，
    // 拿到後這支函式會自己再呼叫一次 render()；週次滑桿拖曳中會連續觸發，debounce 一下
    scheduleQueueFetch(dn,state.week);
    return;
  }

  const today=state.queue[0];
  const todayPlanRaw=planDay(today,mode,pk,orm);
  window.planToday={name:today.name,items:todayPlanRaw.items};

  if(state.editingIdx===0){
    $('#todayWrap').innerHTML=`<div class="pl-card pad today"><div class="bar"></div>
      <div class="head" draggable="true" data-card-idx="0" style="cursor:grab"><h3>${today.name}</h3>${chip(pk)}${cardControlsHtml(0)}</div>
      ${editPanelHtml(0)}</div>`;
  } else {
    const rows=todayPlanRaw.items.map(it=>{
      let badge='';
      if(it.isMain&&pk!=='deload'){const nx=nextWeight(it.w,MAIN[it.name]?MAIN[it.name].type:'upper');badge=`<span class="nbadge b-up">下次 ${fmt(nx.w)}kg</span>`;}
      const accBtn=it.isMain?'':`<button type="button" class="card-icon-btn" style="margin-left:6px" onclick="saveAccWeight('${it.name}')" title="記住這個動作的重量">✎</button>`;
      return `<div class="exrow"><div class="l"><div class="nm">${it.name}</div><div class="sub">${it.sub} · 休息 ${fmtRest(it.rest)}</div></div>
        <div class="r" style="display:flex;align-items:center"><div class="wt">${fmt(it.w)}<small>kg</small> <small>· ${it.sets}×${it.reps}</small></div>${badge}${accBtn}</div></div>`;
    }).join('');
    const deload=pk==='deload'?`<div class="deload"><span>😴</span><span>減量週：重量降至約 55%、砍組數、<b>不練到力竭</b>，清除中樞神經疲勞。</span></div>`:'';
    $('#todayWrap').innerHTML=`<div class="pl-card pad today"><div class="bar"></div>
      <div class="head" draggable="true" data-card-idx="0" style="cursor:grab"><h3>${today.name}</h3>${chip(pk)}${cardControlsHtml(0)}</div>
      <div style="font-size:.83rem;color:var(--faint);margin-top:2px">⏱ 約 ${todayPlanRaw.minutes} 分鐘（含熱身 10 分）· 組間休息 ${fmtRest(ph.rest)}</div>${deload}
      <div class="exlist">${rows}</div>
      <div class="cta"><button class="pl-btn pl-btn-primary" onclick="Runner.start()">開始訓練</button><button class="pl-btn pl-btn-ghost" onclick="openImportModal()">✅ 完成訓練</button></div></div>`;
  }

  let cards=state.queue.slice(1).map((day,idx0)=>{
    const i=idx0+1;
    if(state.editingIdx===i){
      return `<div class="day"><div class="dh" draggable="true" data-card-idx="${i}" style="cursor:grab"><span class="tag" style="background:${ph.color}"></span><span style="flex:1">${day.name}</span>${cardControlsHtml(i)}</div>${editPanelHtml(i)}</div>`;
    }
    const dp=planDay(day,mode,pk,orm);
    const dr=dp.items.map(it=>`<div class="drow"><span class="dn ${it.isMain?'':'acc'}">${it.name}</span><span class="dw" style="display:inline-flex;align-items:center;gap:4px">${fmt(it.w)}kg · ${it.sets}×${it.reps}${it.isMain?'':`<button type="button" class="card-icon-btn" style="width:20px;height:20px;font-size:.68rem" onclick="saveAccWeight('${it.name}')" title="記住這個動作的重量">✎</button>`}</span></div>`).join('');
    return `<div class="day"><div class="dh" draggable="true" data-card-idx="${i}" style="cursor:grab"><span class="tag" style="background:${ph.color}"></span><span style="flex:1">${day.name}</span>${cardControlsHtml(i)}</div><div class="dsub">⏱ 組間休息 ${fmtRest(ph.rest)} · 約 ${dp.minutes} 分</div><div class="db">${dr}</div></div>`;
  });
  if(dn===7)cards.push(`<div class="day rest"><div class="dh"><span class="tag" style="background:#cbd5e1"></span>第 7 天 · 休息日</div><div class="db"><div class="drow" style="border:0"><span class="dn acc">完全休息或輕度活動（散步／伸展），讓身體恢復。</span></div></div></div>`);
  if(cards.length===0)cards.push(`<div class="day"><div class="db" style="padding-top:16px;text-align:center;color:var(--faint)">目前只剩本次課表這一張，練完後可以按上面「＋ 新增課表」繼續排。</div></div>`);
  $('#weekGrid').innerHTML=cards.join('');
}

/* ===== 訓練執行流程 ===== */
const Runner={
  ex:[], exIdx:0, setIdx:0, remain:0, tid:null,
  start(){this.ex=window.planToday?window.planToday.items:[];this.exIdx=0;this.setIdx=0;$('#runner').classList.add('on');this.warmup();},
  close(){this.stop();$('#runner').classList.remove('on');},
  stop(){if(this.tid){clearInterval(this.tid);this.tid=null;}},
  body(h){$('#runnerBody').innerHTML=h;},
  warmup(){this.body(`<div class="step">開始前</div><h2>熱身了嗎？</h2>
    <p class="tgt">先做 5–10 分鐘動態熱身與輕重量暖身組，能大幅降低受傷風險。</p>
    <div class="q-row"><button class="pl-btn-mini" onclick="Runner.close()">還沒，先去熱身</button>
    <button class="pl-btn-xl" style="flex:1" onclick="Runner.showSet()">已熱身，開始 →</button></div>`);},
  dots(total,cur){let h='<div class="rprogress">';for(let i=0;i<total;i++)h+=`<span class="rdot ${i<cur?'done':i===cur?'cur':''}"></span>`;return h+'</div>';},
  showSet(){this.stop();const e=this.ex[this.exIdx];
    this.body(`<div class="step">動作 ${this.exIdx+1} / ${this.ex.length}</div><h2>${e.name}</h2>
      ${this.dots(e.sets,this.setIdx)}
      <div class="big-wt">${fmt(e.w)}<small>kg</small></div>
      <div class="tgt">第 ${this.setIdx+1} / ${e.sets} 組　·　目標 ${e.reps} 下</div>
      <div class="rbtns"><button class="pl-btn-xl" onclick="Runner.startRest()">✓ 完成這一組</button></div>`);},
  startRest(secs){this.stop();const e=this.ex[this.exIdx];this.remain=secs||e.rest;
    this.renderRest();this.tid=setInterval(()=>{this.remain--;if(this.remain<=0){this.stop();this.restDone();}else this.renderRest();},1000);},
  renderRest(){const m=Math.floor(this.remain/60),s=this.remain%60;
    this.body(`<div class="step">組間休息</div><h2>休息中</h2>
      <div class="timer warn">${m}:${s<10?'0':''}${s}</div>
      <p class="tgt">深呼吸、準備下一組</p>
      <div class="rbtns"><button class="pl-btn-mini" onclick="Runner.restDone()">略過休息</button></div>`);},
  restDone(){this.stop();const e=this.ex[this.exIdx],last=this.setIdx>=e.sets-1;
    this.body(`<div class="step">休息結束</div><h2>準備好了嗎？</h2>
      <p class="tgt">${e.name}　·　${last?'這是最後一組':'第 '+(this.setIdx+2)+' / '+e.sets+' 組'}</p>
      <div class="rbtns">
        <button class="pl-btn-xl dark" onclick="Runner.next()">${last?'完成此動作 →':'下一組 →'}</button>
        <button class="pl-btn-mini" onclick="Runner.startRest(30)">再休息 30 秒</button>
      </div>`);},
  next(){const e=this.ex[this.exIdx];this.setIdx++;
    if(this.setIdx>=e.sets){this.exIdx++;this.setIdx=0;if(this.exIdx>=this.ex.length){return this.finish();}}
    this.showSet();},
  finish(){this.stop();this.body(`<div class="step">完成</div><h2>訓練完成 💪</h2>
    <p class="tgt">${window.planToday.name} 全部做完了，好好休息、補充蛋白質。</p>
    <div class="rbtns"><button class="pl-btn-xl" onclick="Runner.saveAndClose()">✅ 存進訓練紀錄</button>
    <button class="pl-btn-mini" onclick="Runner.close()">先不存，關閉</button></div>`);},
  saveAndClose(){this.close();openImportModal();},
};

/* ===== events ===== */
document.querySelectorAll('.seg').forEach(seg=>seg.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  seg.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  state[seg.dataset.seg]=b.dataset.val;render();
}));
$('#weekSlider').addEventListener('input',e=>{state.week=+e.target.value;syncWeekUI();render();});
$('#dlChk').addEventListener('change',e=>{state.deload=e.target.checked;render();});

if(window.planSaved){var sp=window.planSaved;state.mode=sp.mode==='VETERAN'?'veteran':'novice';state.days=String(Math.min(Math.max(sp.days||3,1),7));state.week=Math.min(Math.max(sp.week||8,1),20);document.querySelectorAll('[data-seg=\"mode\"] button').forEach(function(b){b.classList.toggle('active',b.dataset.val===state.mode);});document.querySelectorAll('[data-seg=\"days\"] button').forEach(function(b){b.classList.toggle('active',b.dataset.val===state.days);});var ws=document.getElementById('weekSlider');if(ws)ws.value=state.week;}
buildLiftInputs();syncWeekUI();render();
</script>
