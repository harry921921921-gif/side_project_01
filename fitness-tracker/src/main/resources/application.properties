spring.application.name=fitness-tracker
spring.profiles.active=local

spring.datasource.url=jdbc:mysql://localhost:3306/fitness_tracker?useSSL=false&serverTimezone=Asia/Taipei&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate 會自動根據 MySQL 版本選 dialect，不需要手動指定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# schema.sql（記住我用的 persistent_logins 表）也要在正式的 MySQL 資料庫上跑，不是只有內嵌
# 資料庫（H2 之類）才執行——Spring Boot 預設非內嵌資料庫是 never，這裡要明確打開
spring.sql.init.mode=always

server.port=8080
# 關閉 Open Session In View（避免效能警告）
spring.jpa.open-in-view=false

logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
