spring.application.name=fitness-tracker
spring.profiles.active=local

# DB_HOST 預設 localhost（本機開發不受影響）；Docker Compose 會把它覆蓋成容器名稱 mysql
# allowPublicKeyRetrieval=true：MySQL 8 預設的 caching_sha2_password 認證機制在沒開 SSL 的連線下，
# 需要客戶端明確允許抓取伺服器端的 RSA 公鑰才能完成登入驗證，不然會直接被拒絕連線
# （Public Key Retrieval is not allowed）。這裡連的是自己這台機器/自己控制的 DB 容器，可以信任，
# 才允許這個行為——連不受信任的遠端 MySQL 不該打開這個選項
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/fitness_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate 會自動根據 MySQL 版本選 dialect，不需要手動指定
# 資料表結構改由 Flyway 管理（src/main/resources/db/migration），Hibernate 只負責「檢查」：
# validate = 啟動時比對 Entity 跟資料表是否吻合，不吻合就直接啟動失敗，但絕不自己動手改表。
# 之後要改結構：新增一支 V2__說明.sql，不要改回 update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── Flyway ──
# baseline-on-migrate：遇到「已經有表格、但從沒用過 Flyway」的舊資料庫（例如本機開發庫、
# Docker 的 fittracker_mysql_data volume），不要重跑 V1 建表（會因為表已存在而失敗），
# 而是直接把它記成「已經在第 1 版」，之後只執行 V2 以後的檔案。全新的空資料庫不受影響，照常從 V1 開始跑
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=8080
# 關閉 Open Session In View（避免效能警告）
spring.jpa.open-in-view=false

logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
