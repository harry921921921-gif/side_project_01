spring.application.name=fitness-tracker
spring.profiles.active=local

# DB_HOST 預設 localhost（本機開發不受影響）；Docker Compose 會把它覆蓋成容器名稱 mysql
# allowPublicKeyRetrieval=true：MySQL 8 預設的 caching_sha2_password 認證機制在沒開 SSL 的連線下，
# 需要客戶端明確允許抓取伺服器端的 RSA 公鑰才能完成登入驗證，不然會直接被拒絕連線
# （Public Key Retrieval is not allowed）。這裡連的是自己這台機器/自己控制的 DB 容器，可以信任，
# 才允許這個行為——連不受信任的遠端 MySQL 不該打開這個選項
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/fitness_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate 會自動根據 MySQL 版本選 dialect，不需要手動指定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# schema.sql（記住我用的 persistent_logins 表）也要在正式的 MySQL 資料庫上跑，不是只有內嵌
# 資料庫（H2 之類）才執行——Spring Boot 預設非內嵌資料庫是 never，這裡要明確打開
spring.sql.init.mode=always

server.port=8080
# 關閉 Open Session In View（避免效能警告）
spring.jpa.open-in-view=false

logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
