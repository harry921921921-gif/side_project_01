# ── 正式環境設定：部署時用環境變數 SPRING_PROFILES_ACTIVE=prod 啟用，覆蓋掉
#    application.properties 預設的 local profile。資料庫帳密/REMEMBER_ME_KEY 一樣透過
#    環境變數注入（DB_USERNAME / DB_PASSWORD / REMEMBER_ME_KEY），這個檔案不放任何機密資訊 ──

# 正式環境不要 DEBUG 等級的 SQL/應用程式日誌：一來拖效能，二來查詢參數可能包含使用者的
# 體重、email 這類個資，這些不該留在明碼日誌裡（本機開發的 DEBUG 設定在 application-local.properties）
logging.level.root=WARN
logging.level.fitness_tracker=INFO
logging.level.org.hibernate.SQL=WARN

# 部署在 TLS 反向代理（nginx / Load Balancer）後面時，讓 Spring 讀 X-Forwarded-* 標頭正確判斷
# 這是一個 HTTPS 請求，Session cookie 跟記住我 cookie 才會正確帶上 Secure 旗標，不會有機會
# 透過明碼 HTTP 被送出
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

# ⚠️ 目前還沒有 Flyway/Liquibase 這類正式的資料庫遷移工具，ddl-auto 沿用跟本機一樣的 update——
# 上線前稽核有特別記錄這點：update 模式只會「加」欄位/表格，改欄位型別或改名字不會警告、
# 也不會失敗，只會悄悄留下不一致的殘留結構。這是已知、暫時接受的風險，之後有空建議導入
# Flyway，改用 validate（只檢查結構是否吻合，不自動修改）。
spring.jpa.hibernate.ddl-auto=update
