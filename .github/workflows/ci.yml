# ── CI（Continuous Integration，持續整合）──
# 每次 push 到 GitHub、或有人開 / 更新 Pull Request 時，GitHub 會自動開一台乾淨的 Linux 機器，
# 把專案抓下來跑一次全部的測試。測試沒過，PR 頁面上就會出現紅色叉叉，提醒你先修好再合併。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 專案放在 fitness-tracker/ 子資料夾，下面的指令都在那裡執行
    defaults:
      run:
        working-directory: fitness-tracker

    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 安裝 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # 把 Maven 下載過的套件存起來，下次跑就不用全部重新下載，會快很多
          cache: maven

      # 這台 GitHub 機器本來就裝好 Docker，所以需要 MySQL 的整合測試會由 Testcontainers
      # 自動開一個臨時的 MySQL 容器來跑，不用另外設定資料庫
      - name: 跑全部測試
        run: ./mvnw -B test
